<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 3 </title>
    <!-- this link is used to add bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <!-- Forms -->
    <div class="container">
        <h2>Form Demo</h2>
        <!-- Form control -->
        <!-- mb-3 meaning margin bottom 3 default mARGIN-->
        <form class="mb-3">
            <!-- Layout : suppose we want email and password in one line half half we can put grid properties for it her in form as well .  -->
            <div class="row">
                <div class="mb-3 col-md-6">
                    <!-- col-md-6 matlab medium tak woh 6 6 rahega half half but after crossing it gets to seperate lines again -->
                    <label for="email" class="form-label">Email address</label>
                    <input type="text" class="form-control" id="email" placeholder="name@example.com">
                </div>

                <div class="mb-3 col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="password">
                </div>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control-lg" id="address" placeholder="address">
            </div>

            <!-- Select -->
            <div class="mb-3">
                <select class="form-select">
                    <option selected>Choose ur city</option>
                    <option value="1">Mumbai</option>
                    <option value="2">Pune</option>
                    <option value="3">Delhi</option>
                </select>
            </div>

            <!-- Checkbox and radio -->
            <div class="normal mb-3">
                <input type="checkbox" name="Agree" id="Agree">
                <label for="Agree">Agree</label>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" name="Agree" id="Agreebs" class="form-check-input">
                <label for="Agreebs" class="form-check-label">Agree</label>
            </div>
            <div class="form-check mb-3">
                <input type="radio" name="Agree" id="Radiobs" class="form-check-input">
                <label for="Radiobs" class="form-check-label">Agree</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
