<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms elements and attributes

    </title>
</head>

<body>
    <form action="/server">
        <!--form content-->
        <div>
            Random
            <input><!--input element create a box to type any data-->
            <br>
            Username
            <input type="text"><!--there are many type attribute (text,passworn,number,time,color etc)-->
            <br>
            Password
            <input type="password" placeholder="Enter Password"><!-- Placeholder Attribute -->
            <br>
            Age(number)
            <input type="number">
            <br>
            Time
            <input type="time">
            <br>
            Colour
            <input type="color">
        </div>
        <hr>
        <!-- Label tag -->
        <div>
            <label>
                Username:<!--Whenever we click on the label then the box below is select to type in-->
                <input type="text" placeholder="Enter Username">
            </label>
            <label>
                Password:
                <input type="password" placeholder="Enter Password">
            </label>
        </div>
        <hr>
        <!-- for id in Label classical approach -->
        <div><!--gets the section to a diffrent line-->
            <label for="username">Enter Your Username:</label>
            <input type="text" id="username" placeholder="Username">
        </div>
        <div>
            <label for="password">Enter Your password:</label>
            <input type="password" id="password" placeholder="password">
        </div>
        <div>
            <label for="age">Enter Your Age:</label>
            <input type="number" id="age" placeholder="age">
        </div>
        <hr>
        <!-- Button Element -->
        <div>
            <button>Submit</button>
            <br>
            <!-- Types of button 3 -->
            <button type="submit">submit</button>
            <button type="button">button</button>
            <button type="reset">reset</button>
        </div>
        <hr>
        <div>
            <!-- Button using Input element type-->
            <input type="button">
            <input type="button" value="click me">
            <input type="submit">
        </div>
        <hr>
        <div>
            <!-- Name attribute in input--><!--this is unsafe so in js we wil see how
                to remove this info (sensitive) from url-->
            <!-- this take the name and send the data in name=value pair this can be 
                seen in url-->
            <!-- here we give a name to the value that we want to see after getting 
                submitted.we use it cuz we want the data to be accessed in the backend
                so we use name attribute-->
            <label for="username">Username:</lebel>
            <input type="text" placeholder="Enter Username" id="username" name="user">
            <br>
            <label for="password">Password:</label>
            <input type="password" placeholder="Enter Password" id="password" name="pass">
            <br>
            <label for="age">Age:</label>
            <input type="number" placeholder="Enter age" id="age">
            <br>
            <button type="submit">submit</button>
        </div>

    </form>
