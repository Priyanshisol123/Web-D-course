<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice question</title>
</head>

<body>
    <div>
        <form action="https://www.google.com/search">
            <label for="google">Query:</label>
            <input type="text" id="google" placeholder="Search in google" Name="q">
            <button type="submit">search</button>
            <button type="reset">refresh</button>
        </form>
        <form action="https://www.youtube.com/results?search_query=apple">
            <label for="yt">Query:</label>
            <input type="text" id="yt" placeholder="Search in google" Name="search_query">
            <button type="submit">search</button>
            <button type="reset">refresh</button>
        </form>
        <form action="https://www.quora.com/search">
            <label for="quora">Query:</label>
            <input type="text" id="quora" placeholder="Search in quora" Name="q">
            <button type="submit">search</button>
            <button type="reset">refresh</button>
        </form>
    </div>
</body>

</html>
