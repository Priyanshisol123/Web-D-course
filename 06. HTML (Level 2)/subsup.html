<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sub and sup tag</title>
</head>
<body>
    <h1>Sup Tag (Superscript)</h1>
    <p>(a+b)<sup>2</sup>=a<sup>2</sup>+b<sup>2</sup>+2ab</p><!--Nested tag where p is parent tag and sup is child tag-->

    <h1>Sub Tag (Subscript)</h1>
    <p>H<sub>2</sub>O<br> H<sub>2</sub><br> O<sub>2</sub></p>
    
</body>
</html>
