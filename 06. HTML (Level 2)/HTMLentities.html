<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <h1>a<b</h1>
    <h1>a < b</h1><!--Wrong way-->
    <h1>a&lt;b</h1><!--Correct way-->

    <p>apna          college</p>
    <p>apna &nbsp;   &nbsp; college</p><!--print spacess-->
    <h1>&hearts;</h1> <!--print black heart-->

    <p>a&gt;b</p> <!--print "">"" -->
    <p>a&amp;b</p><!--print "&"-->
    <p>&quot;a&quot;</p><!--print  ' " '-->
    <h1>this is a &bigstar; or &#9733;</h1><!--Character code(in decimal number)-->
</body>
</html>
