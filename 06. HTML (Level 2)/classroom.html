<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Bolck</title>
</head>
<body>
    <h1>Block Element</h1>
    <h2>Hello World</h2><!--Heading element is a Block Element-->
    <h2>Apna College</h2>

    <p>A</p><!--Paragraph element is a Block Element-->
    <p>B</p>

    <h1>Inline Element</h1>
    <a href="www.google.com">Google Me </a><!--Anchore element is an inline Element-->
    <a href="www.facebook.com">Facebook Me </a>
    <a href="www.youtube.com">Youtube Me </a>

    <p><!--Image element is an inline Element-->
    <img src="https://i.pinimg.com/736x/d0/5e/b0/d05eb0f10665186c9e60414cf9dc2b32.jpg" alt="Image"height="170" width="180">
    <img src="https://i.pinimg.com/736x/5b/2e/43/5b2e43ac77755abeb1ff5cf4008d0ba3.jpg" alt="Image" height="240" width="180">
    </p>
</body>
</html>
